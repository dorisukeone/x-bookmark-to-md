<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x-bookmark-to-md</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="shell">
        <header class="top-bar">
            <div class="top-bar-left">
                <span class="ico-md" aria-hidden="true" title="Markdown + ZIP">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.5"/><path d="M14 2v6h6M10 9H8M9 13h5M9 17h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M16 14l2 2 4-4" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <h1 class="app-title">X Bookmarks to Markdown</h1>
            </div>
            <span class="app-ver" id="extVersion">v…</span>
        </header>

        <div class="status-strip status-warning" id="status">
            <div class="status-glyph glyph-warning" id="statusIcon" aria-hidden="true"></div>
            <p class="status-msg" id="statusText">Open bookmarks page</p>
        </div>

        <div class="status-strip status-error prior-error-banner" id="priorErrorBanner" hidden>
            <div class="status-glyph glyph-error" aria-hidden="true"></div>
            <p class="status-msg" id="priorErrorText"></p>
            <button type="button" class="btn-dismiss-error" id="dismissPriorErrorBtn" aria-label="Dismiss">&times;</button>
        </div>

        <button type="button" id="retryExportBtn" class="btn btn-retry" hidden>Retry Export</button>

        <section class="card card-config" aria-label="Export settings">
            <div class="card-head">
                <span class="card-title">Export</span>
            </div>

            <div class="slider-block" title="Bookmark cap. Left = unlimited. Right = 1000+">
                <div class="slider-value-rail">
                    <div class="slider-value" id="capDisplay">∞</div>
                </div>
                <input type="range" id="capSlider" class="cap-range" min="0" max="5" step="1" value="1" aria-valuetext="50 bookmarks max">
                <div class="slider-scale" aria-hidden="true">
                    <span>&#8734;</span><span>50</span><span>100</span><span>200</span><span>500</span><span>1000+</span>
                </div>
            </div>

            <div class="segmented" role="radiogroup" aria-label="Export mode">
                <button type="button" class="seg-item is-active" id="modeFull" role="radio" aria-checked="true" title="Export all bookmarks matching the cap (replaces URL history for next full run)">
                    <span class="seg-ico" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                    </span>
                    <span class="seg-text">Full <em>All</em></span>
                </button>
                <button type="button" class="seg-item" id="modeIncremental" role="radio" aria-checked="false" title="Skip URLs already exported on this device">
                    <span class="seg-ico" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><path d="M7 7h.01"/></svg>
                    </span>
                    <span class="seg-text">Incremental <em>New</em></span>
                </button>
            </div>
        </section>

        <section class="card card-history" id="historyCard" aria-label="Export history">
            <div class="hist-line">
                <span class="hist-ico" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
                </span>
                <div class="hist-copy">
                    <span class="hist-label">Last run</span>
                    <span class="hist-value" id="statLastDisplay">—</span>
                </div>
            </div>
            <div class="hist-line">
                <span class="hist-ico" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/></svg>
                </span>
                <div class="hist-copy">
                    <span class="hist-label">Remembered</span>
                    <span class="hist-value" id="statUrlsDisplay">—</span>
                </div>
            </div>
            <button type="button" class="btn-clear-history" id="clearHistoryBtn" title="Clear stored URLs and last run time" aria-label="Clear history">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M3 6h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M8 6V5a2 2 0 012-2h4a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </section>

        <div class="actions">
            <button type="button" id="openBookmarksBtn" class="btn btn-open">Open bookmarks page</button>
            <button type="button" id="exportBtn" class="btn btn-export" disabled>Export Bookmarks</button>
        </div>
    </div>

    <script src="url-utils.js"></script>
    <script src="analytics-config.js"></script>
    <script src="analytics.js"></script>
    <script src="popup.js"></script>
</body>
</html>
