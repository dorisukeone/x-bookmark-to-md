<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x-bookmark-to-md</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <p class="description">Export your X bookmarks in Markdown format.</p>
        </div>
        
        <div class="content">
            <div class="status" id="status">
                <div class="status-icon warning" id="statusIcon">⚠</div>
                <p id="statusText">Please open the X bookmarks page</p>
            </div>
            
            <div class="options" id="optionsPanel">
                <label class="field">
                    <span class="field-label">Max bookmarks</span>
                    <input type="number" id="maxBookmarksInput" class="field-input" min="0" step="1" placeholder="0 = all" value="0" title="Stop after this many bookmarks (0 = no limit)">
                    <p class="field-hint">Full export + a cap only stores those URLs for incremental mode. Use 0 (no cap) once if you want the full list remembered.</p>
                </label>
                <label class="field checkbox-field">
                    <input type="checkbox" id="incrementalOnly">
                    <span>Incremental only (new since last export on this device)</span>
                </label>
                <p class="field-hint field-hint-tight">With empty history, incremental still loads all visible items once, then remembers their URLs.</p>
                <p class="meta" id="exportHistoryMeta"></p>
                <button type="button" id="clearHistoryBtn" class="btn btn-ghost">
                    Clear export history
                </button>
            </div>
            
            <div class="actions">
                <button id="openBookmarksBtn" class="btn btn-primary">
                    Open Bookmarks Page
                </button>
                
                <button id="exportBtn" class="btn btn-secondary" disabled>
                    Export Bookmarks
                </button>
            </div>
            
            <div class="progress" id="progress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">Processing...</p>
            </div>
        </div>
        
        <div class="footer">
            <p>v1.1.1</p>
        </div>
    </div>
    
    <script src="url-utils.js"></script>
    <script src="popup.js"></script>
</body>
</html>
